services:
  redis:
    image: redis:7.2
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    networks:
      - shared-network

  mongo:
    image: ${MONGO_IMAGE_VERSION:-mongo:7.0}
    container_name: ${MONGO_CONTAINER_NAME:-mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admin}
    volumes:
      - ${MONGO_DATA_PATH:-./mongo_data}:/data/db
    networks:
      - ${DOCKER_NETWORK_NAME:-shared-network}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost:27017 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: python
    stdin_open: true
    tty: true
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shared-network

volumes:
  redis-data:

networks:
  shared-network:
    external: true